---
- name: Deploy the portfolio app
  block:
    - name: Check that build folder exists in synced folder
      stat:
        path: /var/www/portfolio/build
      register: build_dir

    - name: Copy pre-built app to nginx root
      copy:
        src: /var/www/portfolio/build/
        dest: /usr/share/nginx/html/
        remote_src: yes
      when: build_dir.stat.exists

    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
