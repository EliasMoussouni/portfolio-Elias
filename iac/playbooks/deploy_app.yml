---
- name: Build and deploy the portfolio app
  block:
    - name: Install npm dependencies
      command: npm ci
      args:
        chdir: /var/www/portfolio
      environment:
        CI: "false"

    - name: Build the React app
      command: npm run build
      args:
        chdir: /var/www/portfolio
      environment:
        CI: "false"

    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
